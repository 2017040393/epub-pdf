[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-pdf"
version = "0.1.0"
description = "Convert EPUB books to readable PDFs, with optional LLM translation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "beautifulsoup4>=4.12",
    "EbookLib>=0.18",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
epub-pdf = "epub_pdf.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
